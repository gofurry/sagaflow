name: sagaflow

services:
  sagaflow:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: v0.1.0
    image: sagaflow:v0.1.0
    container_name: sagaflow
    ports:
      - "8080:8080"
    volumes:
      - sagaflow_data:/data
    restart: unless-stopped

volumes:
  sagaflow_data:
